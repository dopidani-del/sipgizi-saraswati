
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIPGIZI SARASWATI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#243047}
header{background:#087f6b;color:white;padding:20px}
header h2{margin:0 0 5px}
.container{max-width:900px;margin:auto;padding:16px}
.card{background:white;padding:16px;border-radius:14px;margin:12px 0;box-shadow:0 2px 8px #0001}
input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ccd5df;border-radius:8px;font-size:15px}
button{background:#087f6b;color:white;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#64748b}
button.danger{background:#b42318}
nav{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
nav button{margin:0}
.hidden{display:none}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat div{background:#e6f5f1;padding:15px;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}
.tablewrap{overflow-x:auto}
.small{font-size:13px;color:#64748b}
</style>
</head>
<body>

<header>
<h2>SIPGIZI SARASWATI</h2>
<div>Instalasi Gizi RSU Saraswati</div>
</header>

<div class="container">

<!-- LOGIN -->
<section id="login" class="card">
<h3>Login Pengguna</h3>
<p class="small">MODE DEMO – gunakan nama dan pilih jabatan.</p>
<label>Nama pengguna</label>
<input id="namaLogin" placeholder="Contoh: Petugas Demo">
<label>Jabatan</label>
<select id="jabatan">
<option value="">-- Pilih jabatan --</option>
<option>Ahli Gizi</option>
<option>Juru Masak</option>
<option>Pramusaji</option>
<option>Kepala Instalasi</option>
</select>
<button onclick="masuk()">Masuk Aplikasi</button>
</section>

<!-- APLIKASI -->
<section id="aplikasi" class="hidden">
<div class="card">
<b id="salam"></b>
<p class="small">Akses demo sesuai jabatan yang dipilih.</p>
<button class="secondary" onclick="keluar()">Keluar</button>
</div>

<nav id="menu"></nav>
<div id="konten"></div>
</section>
</div>

<script>
const KEY="sipgiziDataV2";
let data=JSON.parse(localStorage.getItem(KEY)||"null") || [
 {nama:"Pasien Demo 1",kamar:"101",diet:"Biasa",waktu:"Pagi",status:"Belum"},
 {nama:"Pasien Demo 2",kamar:"102",diet:"Rendah Garam",waktu:"Siang",status:"Belum"},
 {nama:"Pasien Demo 3",kamar:"103",diet:"Diabetes",waktu:"Malam",status:"Belum"}
];

let pengguna="";
let jabatan="";
 let jadwal=JSON.parse(localStorage.getItem("sipgiziJadwal")||"[]");

function simpan(){
 localStorage.setItem(KEY,JSON.stringify(data));
}

function masuk(){
 pengguna=document.getElementById("namaLogin").value.trim();
 jabatan=document.getElementById("jabatan").value;
 if(!pengguna || !jabatan){
  alert("Isi nama dan pilih jabatan terlebih dahulu.");
  return;
 }
 document.getElementById("login").classList.add("hidden");
 document.getElementById("aplikasi").classList.remove("hidden");
 document.getElementById("salam").textContent="Selamat datang, "+pengguna+" – "+jabatan;
 buatMenu();
 tampil("Beranda");
}

function keluar(){
 pengguna="";
 jabatan="";
 document.getElementById("aplikasi").classList.add("hidden");
 document.getElementById("login").classList.remove("hidden");
 document.getElementById("namaLogin").value="";
 document.getElementById("jabatan").value="";
}

function buatMenu(){
 let daftar=["Beranda"];daftar.push("Jadwal Petugas");
 if(jabatan==="Ahli Gizi") daftar.push("Data Pasien","Laporan");
 if(jabatan==="Juru Masak") daftar.push("Dapur");
 if(jabatan==="Pramusaji") daftar.push("Distribusi");
 if(jabatan==="Kepala Instalasi") daftar.push("Monitoring","Laporan");
 daftar.push("Tentang");

 document.getElementById("menu").innerHTML=daftar.map(x=>
  `<button onclick="tampil('${x}')">${x}</button>`
 ).join("");
}

function tampil(halaman){
 let area=document.getElementById("konten");
 if(halaman==="Beranda"){
  area.innerHTML=`
  <div class="card"><h3>Dashboard</h3>
  <div class="stat">
   <div><b>${data.length}</b><br>Data pasien</div>
   <div><b>${data.filter(x=>x.status==="Sudah").length}</b><br>Sudah didistribusikan</div>
   <div><b>${data.filter(x=>x.status!=="Sudah").length}</b><br>Belum didistribusikan</div>
   <div><b>${data.length}</b><br>Total porsi demo</div>
  </div></div>`;
 }
 else if(halaman==="Data Pasien" && jabatan==="Ahli Gizi"){
  area.innerHTML=`
  <div class="card"><h3>Tambah Data Pasien Demo</h3>
  <input id="pNama" placeholder="Nama pasien fiktif">
  <input id="pKamar" placeholder="Nomor kamar">
  <select id="pDiet">
   <option>Biasa</option><option>Rendah Garam</option>
   <option>Diabetes</option><option>Rendah Lemak</option>
   <option>Diet Lunak</option>
  </select>
  <select id="pWaktu">
   <option>Pagi</option><option>Siang</option><option>Malam</option>
  </select>
  <button onclick="tambahPasien()">Simpan Data Demo</button>
  </div>
  <div class="card"><h3>Daftar Pasien Demo</h3>${tabelPasien(true)}</div>`;
 }
 else if(halaman==="Distribusi" && jabatan==="Pramusaji"){
  area.innerHTML=`<div class="card"><h3>Daftar Distribusi</h3>
  <p class="small">Periksa data diet dan kamar sebelum menandai pengiriman.</p>
  ${tabelPasien(true)}</div>`;
 }
 else if(halaman==="Dapur" && jabatan==="Juru Masak"){
  let pagi=data.filter(x=>x.waktu==="Pagi").length;
  let siang=data.filter(x=>x.waktu==="Siang").length;
  let malam=data.filter(x=>x.waktu==="Malam").length;
  area.innerHTML=`<div class="card"><h3>Persiapan Makanan Demo</h3>
  <p>Porsi pagi: <b>${pagi}</b></p>
  <p>Porsi siang: <b>${siang}</b></p>
  <p>Porsi malam: <b>${malam}</b></p>
  <h3>Daftar Diet</h3>${tabelPasien(false)}</div>`;
 }
 
else if((halaman==="Laporan" && (jabatan==="Ahli Gizi"||jabatan==="Kepala Instalasi")) || (halaman==="Monitoring" && jabatan==="Kepala Instalasi")){

 let total=data.length;
 let selesai=data.filter(x=>x.status==="Sudah").length;
 let belum=total-selesai;
 let persen=total?Math.round(selesai/total*100):0;

 let rekap=["Pagi","Siang","Malam"].map(w=>{
  let daftar=data.filter(x=>x.waktu===w);
  let terkirim=daftar.filter(x=>x.status==="Sudah").length;
  return `
  <tr>
   <td>${w}</td>
   <td>${daftar.length}</td>
   <td>${terkirim}</td>
   <td>${daftar.length-terkirim}</td>
  </tr>`;
 }).join("");

 area.innerHTML=`
 <div class="card">
  <h3>${halaman} Distribusi Makanan</h3>

  <div class="stat">
   <div><b>${total}</b><br>Total porsi demo</div>
   <div><b>${selesai}</b><br>Sudah dikirim</div>
   <div><b>${belum}</b><br>Belum dikirim</div>
   <div><b>${persen}%</b><br>Persentase distribusi</div>
  </div>

  <h3>Rekap Berdasarkan Waktu Makan</h3>
  <div class="tablewrap">
   <table>
    <tr>
     <th>Waktu</th>
     <th>Total</th>
     <th>Sudah</th>
     <th>Belum</th>
    </tr>
    ${rekap}
   </table>
  </div>

  <h3>Progres Distribusi</h3>
  <div style="background:#ddd;border-radius:10px;height:18px;overflow:hidden">
   <div style="width:${persen}%;background:#087f6b;height:18px"></div>
  </div>
  <p><b>${persen}%</b> makanan telah didistribusikan.</p>

  <h3>Detail Distribusi</h3>
  ${tabelPasien(false)}

  <button onclick="window.print()">Cetak / Simpan PDF</button>
 </div>`;
}

  else if(halaman==="Jadwal Petugas"){
 area.innerHTML=`
 <div class="card">
 <h3>Jadwal Kerja Petugas</h3>
 ${jabatan==="Kepala Instalasi"?`
 <input id="jNama" placeholder="Nama petugas">
 <input id="jTanggal" type="date">
 <select id="jShift">
 <option>Pagi</option>
 <option>Siang</option>
 <option>Libur</option>
 </select>
 <button onclick="tambahJadwal()">Simpan Jadwal</button>
 `:"<p>Jadwal petugas Instalasi Gizi.</p>"}
 <div class="tablewrap">
 <table>
 <tr><th>Nama</th><th>Tanggal</th><th>Shift</th>
 ${jabatan==="Kepala Instalasi"?"<th>Aksi</th>":""}</tr>
 ${jadwal.map((j,i)=>`
 <tr><td>${aman(j.nama)}</td>
 <td>${aman(j.tanggal)}</td>
 <td>${aman(j.shift)}</td>
 ${jabatan==="Kepala Instalasi"?
 `<td><button class="danger" onclick="hapusJadwal(${i})">Hapus</button></td>`:""}
 </tr>`).join("")}
 </table>
 </div>
 </div>`;
  }
 else if(halaman==="Tentang"){
  area.innerHTML=`<div class="card"><h3>Tentang Aplikasi</h3>
  <p>SIPGIZI SARASWATI – prototipe pembelajaran alur kerja Instalasi Gizi.</p>
  <p><b>MODE DEMO.</b> Belum terhubung dengan sistem rumah sakit.</p>
  <p>Jangan memasukkan identitas atau data kesehatan pasien sebenarnya.</p></div>`;
 }
 else{
  area.innerHTML=`<div class="card">Menu tidak tersedia untuk jabatan ini.</div>`;
 }
}

function tambahPasien(){
 let nama=document.getElementById("pNama").value.trim();
 let kamar=document.getElementById("pKamar").value.trim();
 let diet=document.getElementById("pDiet").value;
 let waktu=document.getElementById("pWaktu").value;
 if(!nama||!kamar){alert("Isi nama demo dan nomor kamar.");return;}
 data.push({nama,kamar,diet,waktu,status:"Belum"});
 simpan();
 tampil("Data Pasien");
}

function tabelPasien(aksi){
 if(data.length===0)return "<p>Belum ada data.</p>";
 return `<div class="tablewrap"><table>
 <tr><th>Nama Demo</th><th>Kamar</th><th>Diet</th><th>Waktu</th><th>Status</th>${aksi?"<th>Aksi</th>":""}</tr>
 ${data.map((p,i)=>`<tr>
 <td>${aman(p.nama)}</td><td>${aman(p.kamar)}</td>
 <td>${aman(p.diet)}</td><td>${aman(p.waktu)}</td>
 <td>${p.status}</td>
 ${aksi?`<td><button onclick="ubahStatus(${i})">${p.status==="Sudah"?"Batalkan":"Tandai terkirim"}</button></td>`:""}
 </tr>`).join("")}
 </table></div>`;
}

function ubahStatus(i){
 if(jabatan!=="Pramusaji" && jabatan!=="Ahli Gizi")return;
 data[i].status=data[i].status==="Sudah"?"Belum":"Sudah";
 simpan();
 tampil(jabatan==="Pramusaji"?"Distribusi":"Data Pasien");
}

function aman(teks){
 return String(teks).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
 function tambahJadwal(){
 let nama=document.getElementById("jNama").value.trim();
 let tanggal=document.getElementById("jTanggal").value;
 let shift=document.getElementById("jShift").value;

 if(jabatan!=="Kepala Instalasi")return;

 if(!nama||!tanggal){
  alert("Isi nama dan tanggal jadwal.");
  return;
 }

 jadwal.push({nama,tanggal,shift});
 localStorage.setItem("sipgiziJadwal",JSON.stringify(jadwal));
 tampil("Jadwal Petugas");
}

function hapusJadwal(i){
 if(jabatan!=="Kepala Instalasi")return;
 if(confirm("Hapus jadwal ini?")){
  jadwal.splice(i,1);
  localStorage.setItem("sipgiziJadwal",JSON.stringify(jadwal));
  tampil("Jadwal Petugas");
 }
}
</script>
</body>
</html>
